# ------------------------------------------------------------
# Compose unificado del TP Integrador - Grupo 04.
#
# Levanta los motores de la solucion a partir del compose de cada
# componente, sin duplicar su definicion. Cada integrante mantiene el archivo
# de su parte y este solo lo incorpora.
#
# Para incorporar un componente alcanza con descomentar su bloque, una vez
# que el archivo exista: Compose falla si se incluye una ruta inexistente.
#
# El `env_file` de cada bloque selecciona de forma explicita el entorno del
# componente y conviene mantenerlo: deja escrito de donde salen las variables
# y produce un error que nombra el archivo faltante.
#
# No es, sin embargo, la unica proteccion. Los composes de Redis y de MongoDB
# interpolan sus variables con la sintaxis ${VAR:?mensaje}, de modo que un
# archivo ausente, incompleto o con un valor vacio aborta Compose en lugar de
# arrancar el servicio mal configurado. Conviene que PostgreSQL haga lo mismo:
# el env_file cubre el archivo que falta y ${VAR:?} cubre la variable que
# falta dentro de un archivo que si existe.
#
# Requiere que cada componente tenga su .env creado a partir de su
# .env.example. Ver README.md.
# ------------------------------------------------------------

name: bdia_g04_tp

include:
  # Redis - cache de recomendaciones, sesiones anonimas, rankings y rate limit.
  - path: nosql/redis/docker-compose.yml
    env_file: nosql/redis/.env

  # PostgreSQL - datos transaccionales y de catalogo.
  - path: db/docker-compose.yml
    env_file: db/.env

  # MongoDB - eventos de interaccion del usuario.
  - path: nosql/mongodb/docker-compose.yml
    env_file: nosql/mongodb/.env
